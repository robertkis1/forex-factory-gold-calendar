name: Update Forex Calendar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh calendar
        run: python update_calendar.py
      - name: Commit calendar changes
        run: |
          git config user.name 'calendar-bot'
          git config user.email 'calendar-bot@users.noreply.github.com'
          git add xauusd_news.ics
          git diff --cached --quiet || (git commit -m 'Refresh economic calendar' && git push)
